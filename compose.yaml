# The credentials below are fixed, local-only test values and must never be used elsewhere.
name: cosmosearch-dev

services:
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: cosmosearch-local
      RUSTFS_SECRET_KEY: cosmosearch-local-only
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  rustfs-data:
