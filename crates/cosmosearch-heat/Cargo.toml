[package]
name = "cosmosearch-heat"
description = "Usage tracking for cosmosearch, which decides where vectors pay off."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-util = []

[dependencies]
bytes.workspace = true
cosmosearch-core.workspace = true
cosmosearch-store.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
cosmosearch-store = { path = "../cosmosearch-store", features = ["test-util"] }
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-util"]
