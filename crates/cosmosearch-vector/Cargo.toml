[package]
name = "cosmosearch-vector"
description = "Vector search for cosmosearch: an IVF index and an embedding store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cosmosearch-core.workspace = true
cosmosearch-store.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
cosmosearch-core = { path = "../cosmosearch-core", features = ["test-util"] }
proptest.workspace = true
cosmosearch-store = { path = "../cosmosearch-store", features = ["s3", "test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
